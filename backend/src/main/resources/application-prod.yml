server:
  forward-headers-strategy: none

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus

spring:
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"
    validate-migration-naming: true
    clean-disabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

app:
  email:
    provider: ${EMAIL_PROVIDER:brevo}
    mail-from: ${AUTH_MAIL_FROM:mail@10signal.me}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:mail@10signal.me}
      sender-name: ${BREVO_SENDER_NAME:10Signal}
      reply-to: ${BREVO_REPLY_TO:10signal.me@gmail.com}
      api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  payment:
    provider: ${PAYMENT_PROVIDER:disabled}
  auth:
    mail-from: ${AUTH_MAIL_FROM:}
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    require-https: ${REQUIRE_HTTPS:true}
