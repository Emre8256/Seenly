spring:
  datasource:
    url: ${DEV_DB_URL:jdbc:postgresql://localhost:5432/seenly_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DEV_DB_USERNAME:seenly_dev}
    password: ${DEV_DB_PASSWORD:seenly_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

app:
  email:
    mail-from: ${AUTH_MAIL_FROM:mail@10signal.me}
  auth:
    mail-from: ${AUTH_MAIL_FROM:mail@10signal.me}
  security:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
