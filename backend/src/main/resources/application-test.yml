spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/seenly_test}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DB_USERNAME:seenly_test}
    password: ${TEST_DB_PASSWORD:seenly_test_password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  email:
    provider: disabled
  payment:
    provider: disabled
  auth:
    mail-from: no-reply@tensignal.test
  security:
    allowed-origins:
      - http://localhost:3000
