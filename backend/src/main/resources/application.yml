server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: seenly-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Default datasource: In-memory H2 Database for local development
  datasource:
    url: jdbc:h2:mem:seenlydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

---
# Production profile for PostgreSQL (activated via SPRING_PROFILES_ACTIVE=prod)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seenly_db}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  h2:
    console:
      enabled: false
